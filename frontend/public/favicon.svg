<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Luxury Gold Gradients -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#F3CE6D" />
      <stop offset="55%" stop-color="#D49B28" />
      <stop offset="85%" stop-color="#AA7414" />
      <stop offset="100%" stop-color="#734B07" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E298" />
      <stop offset="50%" stop-color="#E2B24C" />
      <stop offset="100%" stop-color="#B87D17" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1B149" />
      <stop offset="100%" stop-color="#6F4603" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1917" />
      <stop offset="50%" stop-color="#11100F" />
      <stop offset="100%" stop-color="#070605" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E6B750" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#E6B750" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Dark Luxury Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#goldShine)" stroke-width="8" />
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="rgba(243, 206, 109, 0.25)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="256" cy="235" r="190" fill="url(#goldGlow)" />

  <g filter="url(#shadow)">
    <!-- Architectural Towers / Skyline -->
    <!-- Center Tall Spire -->
    <path d="M256 68 L284 104 V270 H228 V104 Z" fill="url(#goldShine)" />
    <!-- Center Bevel / Core Column -->
    <path d="M256 68 L256 270 H240 V110 Z" fill="url(#goldLight)" opacity="0.6" />

    <!-- Left Inner Tower -->
    <path d="M216 118 L232 136 V270 H204 V136 Z" fill="url(#goldLight)" />
    <!-- Right Inner Tower -->
    <path d="M296 118 L308 136 V270 H280 V136 Z" fill="url(#goldDark)" />

    <!-- Left Outer Tower -->
    <path d="M192 165 L204 178 V270 H182 V178 Z" fill="url(#goldLight)" />
    <!-- Right Outer Tower -->
    <path d="M320 165 L330 178 V270 H308 V178 Z" fill="url(#goldDark)" />

    <!-- Sweeping Architectural Side Wings / Arches -->
    <!-- Left Wing -->
    <path d="M148 270 C146 195 180 148 214 125 C205 142 198 170 198 200 C198 238 212 262 222 270 Z" fill="url(#goldShine)" />
    <!-- Right Wing -->
    <path d="M364 270 C366 195 332 148 298 125 C307 142 314 170 314 200 C314 238 300 262 290 270 Z" fill="url(#goldLight)" />

    <!-- Center Foundation Arch / Doorway -->
    <path d="M236 270 V232 Q256 214 276 232 V270 H264 V238 Q256 226 248 238 V270 Z" fill="#11100F" />
    <path d="M246 270 V244 Q256 234 266 244 V270 Z" fill="url(#goldShine)" />

    <!-- Base Plinth Horizon Line -->
    <rect x="136" y="278" width="240" height="8" rx="4" fill="url(#goldShine)" />
    <rect x="176" y="292" width="160" height="4" rx="2" fill="url(#goldLight)" />

    <!-- Iconic Bold Geometric "RRR" Monogram -->
    <text x="256" y="396" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="94" font-weight="800" fill="url(#goldShine)" text-anchor="middle" letter-spacing="4">RRR</text>

    <!-- Subtitle: DEVELOPERS -->
    <text x="256" y="460" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="600" fill="url(#goldLight)" text-anchor="middle" letter-spacing="12">DEVELOPERS</text>
  </g>
</svg>